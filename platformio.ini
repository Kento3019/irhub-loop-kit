; IRハブ
; env:esp32  本体。espressif32 6.x（Arduino core 2.x）。要件7章により 3.x 系（pioarduino）は使わない
; env:native 単体テスト（PC の gcc でビルド）
; env:dump   フェーズ1の受信ダンプ（IO14、115200bps）。src/ ではなく tools/phase1_dump/ をビルドする

[platformio]
default_envs = esp32

[common]
lib_deps_core =
    bblanchon/ArduinoJson@^7.2.0

[env:esp32]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; lib/core は C++17（std::optional 等）前提。Arduino core 2.x の既定 gnu++11 を外す
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
; web/index.html を src/generated/index_html.h に埋め込む（D-05 10節）
extra_scripts = pre:tools/embed_html.py
lib_deps =
    ${common.lib_deps_core}
    crankyoldgit/IRremoteESP8266@^2.8.6
    robtillaart/DHT20@^0.3.1
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall
lib_deps =
    ${common.lib_deps_core}

[env:dump]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../tools/phase1_dump/>
lib_deps =
    crankyoldgit/IRremoteESP8266@^2.8.6
lib_ignore = core
test_ignore = *

; env:pincheck 一時的な診断用（人の指示による）。IO14 のレベルと変化回数を表示する。赤外線は送らない
[env:pincheck]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../tools/pincheck/>
lib_ignore = core
test_ignore = *

; env:adccheck 一時的な診断用（人の指示による）。IO34 の電圧を mV で表示する。赤外線は送らない
[env:adccheck]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../tools/adccheck/>
lib_ignore = core
test_ignore = *
